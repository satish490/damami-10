# This theme is marked as @internal. It is intended to evolve and change over
# minor releases.
# Change record https://www.drupal.org/node/2582945.
# As the UI of Drupal improves between minor versions, the markup and assets
# in the thakurji_admin theme will change. The thakurji_admin theme is not backwards compatible.
# If you wish to modify the output or assets of thakurji_admin you can:
# 1. Copy the whole of thakurji_admin and rename it as your own administration theme. You
# will need to manually manage your own updates if you want to stay up to
# date with thakurji_admin's bug fixes and feature support.
#
# 2. Sub-theme thakurji_admin. This is only recommended if you want to make minor tweaks
# and understand that thakurji_admin could break your modifications as it changes.
name: thakurji_admin
type: theme
base theme: false
description: A clean, accessible, and powerful Drupal administration theme.
alt text: Screenshot of thakurji_admin, Drupal administration theme.
package: Core
# version: VERSION
core_version_requirement: ^11 || ^10
libraries:
  - core/drupal.message
  - core/normalize
  - thakurji_admin/global-styling
libraries-override:
  core/drupal.tabledrag:
    css:
      component:
        misc/components/tabledrag.module.css: css/components/tabledrag.css

  core/drupal.ajax:
    css:
      component:
        misc/components/ajax-progress.module.css: css/components/ajax-progress.module.css

  core/drupal.autocomplete:
    css:
      component:
        misc/components/autocomplete-loading.module.css: css/components/autocomplete-loading.module.css

  system/base:
    css:
      component:
        css/components/system-status-counter.css: css/components/system-status-counter.css
        css/components/system-status-report-counters.css: css/components/system-status-report-counters.css
        css/components/system-status-report-general-info.css: css/components/system-status-report-general-info.css

  system/admin:
    css:
      theme:
        css/system.admin.css: false

  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: css/components/dropbutton.css

  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false

  core/internal.jquery_ui:
    css:
      theme:
        assets/vendor/jquery.ui/themes/base/theme.css: false

  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/base/dialog.css: false

  user/drupal.user:
    css:
      component:
        css/user.module.css: false

  field_ui/drupal.field_ui:
    css:
      theme:
        css/field_ui.admin.css: css/theme/field-ui.admin.css

  node/drupal.node:
    css:
      layout:
        css/node.module.css: false

  node/form:
    css:
      layout:
        css/node.module.css: false

  toolbar/toolbar:
    css:
      component:
        css/toolbar.module.css: css/components/toolbar.module.css
      theme:
        css/toolbar.theme.css: css/theme/toolbar.theme.css
        css/toolbar.icons.theme.css: css/theme/toolbar.icons.theme.css

  toolbar/toolbar.menu:
    css:
      state:
        css/toolbar.menu.css: css/state/toolbar.menu.css

  views_ui/admin.styling:
    css:
      component:
        css/views_ui.admin.css: css/components/views_ui.admin.css
      theme:
        css/views_ui.admin.theme.css: css/theme/views_ui.admin.theme.css

libraries-extend:
  core/drupal.collapse:
    - thakurji_admin/details-focus
  core/drupal.dialog:
    - thakurji_admin/thakurji_admin.drupal.dialog
  core/drupal.dropbutton:
    - thakurji_admin/dropbutton
  core/drupal.checkbox:
    - thakurji_admin/checkbox
  core/drupal.message:
    - thakurji_admin/messages
  core/drupal.progress:
    - thakurji_admin/progress
  core/drupal.tabbingmanager:
    - thakurji_admin/tabbingmanager
  core/drupal.tabledrag:
    - thakurji_admin/thakurji_admin.tabledrag
  core/drupal.tableselect:
    - thakurji_admin/tableselect
  core/drupal.vertical-tabs:
    - thakurji_admin/vertical-tabs
  file/drupal.file:
    - thakurji_admin/file
  filter/drupal.filter.admin:
    - thakurji_admin/filter
  filter/drupal.filter:
    - thakurji_admin/filter
  system/admin:
    - thakurji_admin/system.admin
  core/drupal.autocomplete:
    - thakurji_admin/autocomplete
  tour/tour-styling:
    - thakurji_admin/tour-styling
  shortcut/drupal.shortcut:
    - thakurji_admin/drupal.shortcut
  core/drupal.ajax:
    - thakurji_admin/ajax
  user/drupal.user:
    - thakurji_admin/form.password-confirm
  node/drupal.node.preview:
    - thakurji_admin/drupal.node.preview
  views/views.module:
    - thakurji_admin/views
  views_ui/admin.styling:
    - thakurji_admin/views_ui
  media/media_embed_ckeditor_theme:
    - thakurji_admin/classy.media_embed_ckeditor_theme
  media_library/ui:
    - thakurji_admin/media_library.ui
  media_library/view:
    - thakurji_admin/media_library.theme
  media_library/widget:
    - thakurji_admin/media_library.theme
  image/admin:
    - thakurji_admin/image.admin

regions:
  header: Header
  pre_content: Pre-content
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  help: Help
  content: Content
  page_top: Page top
  page_bottom: Page bottom
  sidebar_first: First sidebar
regions_hidden:
  - sidebar_first
